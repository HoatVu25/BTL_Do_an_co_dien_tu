; PlatformIO Project Configuration File
; Đề tài: Hệ thống cửa bảo mật tích hợp Vân tay AS608, RFID RC522, Keypad & LCD
; Nhóm 13: Nguyễn Tuấn Sơn - Vũ Hữu Hoạt

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; Sử dụng hệ thống file LittleFS để lưu trữ Web App (HTML/CSS/JS) và Database JSON
board_build.filesystem = littlefs
board_build.partitions = default.csv

; Các thư viện phần cứng và Web Server bất đồng bộ
lib_deps =
    mathieucarbou/ESPAsyncWebServer @ ^3.3.22
    mathieucarbou/AsyncTCP @ ^3.2.14
    bblanchon/ArduinoJson @ ^7.2.0
    adafruit/Adafruit Fingerprint Sensor Library @ ^2.1.3
    miguelbalboa/MFRC522 @ ^1.4.11
    chris--a/Keypad @ ^3.1.1
    marcoschwartz/LiquidCrystal_I2C @ ^1.1.4
